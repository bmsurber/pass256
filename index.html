<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pass256</title>
    <script type="text/javascript">
        // base64( HMAC-SHA256(key = masterKey, message = account) ), both UTF-8 encoded.
        async function hmacSha256Base64(masterKey, account) {
            var encoder = new TextEncoder();
            var keyBytes = encoder.encode(masterKey);
            // Web Crypto rejects zero-length HMAC keys. HMAC zero-pads keys shorter
            // than the 64-byte SHA-256 block, so an empty key is identical to 64 zero bytes.
            if (keyBytes.length === 0) {
                keyBytes = new Uint8Array(64);
            }
            var key = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
            var mac = new Uint8Array(await crypto.subtle.sign("HMAC", key, encoder.encode(account)));
            return btoa(String.fromCharCode.apply(null, mac));
        }

        async function pass256() {
            if (!window.crypto || !window.crypto.subtle) {
                alert("Web Crypto is unavailable. Open this page over HTTPS, localhost, or as a local file.");
                return;
            }
            var parameters = document.getElementById("parameters").value;
            var password = document.getElementById("password").value;
            var length = document.getElementById("length").value;
            length = parseInt(length);
            length = length || 32;
            if (length > 42) {
                length = 42;
            }
            document.getElementById("length").value = length;
            var output = await hmacSha256Base64(password, parameters);
            var dk = document.getElementById("dk");
            dk.type = 'password'
            dk.value = output.substring(0,length);
            output = "";
            password = "";
            parameters = "";
        }
    </script>

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: verdana, arial, sans-serif;
            font-size: 120%;
        }

        main {
            margin: 5%;
        }

        input {
            font-family: "Lucida Console", monospace;
            font-size: 1em;
            height: 1.5em;
        }

        input:focus {
            background: LightBlue;
        }

        label {
            margin: 0.7em;
            display: block;
        }

        .btn {
            border-radius: 3px;
            margin: 0px 0.8em;
            height: 2em;
            color: #000000;
            padding: 0px 10px;
            border: solid #000000 3px;
        }

        .btn:hover, .btn:focus {
            background: LightBlue;
        }
    </style>

</head>
<body>
    <main>
        <form name="form1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onsubmit="">
            <label>Master Key<br>
                <input type="password" name="password" id="password" size="33" tabindex="1" autofocus autocomplete="new-password" style="width: 100%"
                onkeydown="if (event.keyCode == 13) { pass256(); return false; }"><br>
            </label>
            <label>Account<br>
                <input type="text" name="parameters" id="parameters" size="33" tabindex="2" style="width: 100%;"
                onkeydown="if (event.keyCode == 13) { pass256(); return false; }"><br>
            </label>
            <label>Length<br>
                <input type="text" name="length" id="length" value="32" size="3" maxlength="2" tabindex="3" style="width: 100%;"
                onkeydown="if (event.keyCode == 13) { pass256(); return false; }"><br>
            </label>
            <label>Password<br>
                <input type="password" name="dk" id="dk" size="33" onBlur="javascript:if(this.value!==''){this.type='password'}" onFocus="javascript:if(this.value!==''){this.type='text'}"  onClick="this.setSelectionRange(0, this.value.length);" style="width: 100%;" tabindex="4"><br>
            </label>
        <input type="button" class="btn" value="Submit" name="submit" id="submit" onclick="pass256();" tabindex="5">
        <input type="reset"  class="btn" tabindex="6">
        </form>
    </main>
</body>
</html>
